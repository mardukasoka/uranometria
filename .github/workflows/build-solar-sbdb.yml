name: Build Solar SBDB Snapshot
on:
  push:
    branches: [integration/atlas-space-outer-solar-system]
    paths:
      - scripts/build_solar_sbdb_snapshot.py
      - web/data/solar-system/visual-presence-manifest.json
      - .github/workflows/build-solar-sbdb.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/atlas-space-outer-solar-system
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build JPL snapshot
        run: python scripts/build_solar_sbdb_snapshot.py
      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/solar-system/jpl-sbdb-snapshot.json
          git diff --cached --quiet || git commit -m "data: refresh JPL SBDB Solar System snapshot"
          git push
