name: Cosmic Compass FITS WCS offline tests
on:
  push:
    branches:
      - feature/cosmic-compass-gc-uv
    paths:
      - 'tools/validate_survey_wcs.py'
      - 'tools/test_validate_survey_wcs.py'
      - 'tools/validate_galex_triplet.py'
      - 'tools/test_validate_galex_triplet.py'
      - '.github/workflows/cosmic-compass-wcs.yml'
  pull_request:
    paths:
      - 'tools/validate_survey_wcs.py'
      - 'tools/test_validate_survey_wcs.py'
      - 'tools/validate_galex_triplet.py'
      - 'tools/test_validate_galex_triplet.py'
      - '.github/workflows/cosmic-compass-wcs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-wcs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'astropy>=6,<8'
      - name: Run offline synthetic WCS tests
        run: python -m unittest discover -s tools -p 'test_validate_*wcs.py' -v && python -m unittest discover -s tools -p 'test_validate_galex_triplet.py' -v
      - name: Scientific interpretation
        run: echo 'Synthetic WCS tests do not establish GALEX survey coverage or live deployment.'
