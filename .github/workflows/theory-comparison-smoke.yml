name: Theory comparison smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node web/theory-comparison/smoke.test.cjs
      - run: node web/theory-comparison/evidence-contract.test.cjs
